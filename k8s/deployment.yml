apiVersion: apps/v1
kind: Deployment
metadata:
  name: chainlit-chatbot
  labels:
    app: chainlit-chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chainlit-chatbot
  template:
    metadata:
      labels:
        app: chainlit-chatbot
    spec:
      containers:
      - name: chainlit-chatbot
        image: trieule0801/chainlit-chatbot:latest   # You already built and pushed this
        ports:
        - containerPort: 7860
        # envFrom:
        # - secretRef:
        #     name: chatbot-env
        command: ["/bin/bash", "-c", "export PYTHONPATH=. && chainlit run ui/main.py --host 0.0.0.0 --port 7860"]
